<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snoopgram V3.7</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:sans-serif;padding-bottom:60px}.h{height:60px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid #222;position:sticky;top:0;background:#000;z-index:10}.logo{font-size:28px;font-weight:900;background:linear-gradient(45deg,#feda75,#d62976);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.banner{background:#ff0;color:#000;padding:10px;text-align:center;font-weight:800;font-size:12px}.post{border-bottom:8px solid #111}.ph{height:50px;display:flex;align-items:center;gap:10px;padding:0 12px}.pr{width:32px;height:32px;border-radius:50%;background:linear-gradient(45deg,#feda75,#d62976);display:flex;align-items:center;justify-content:center;font-weight:800}.m{width:100%;background:#111;aspect-ratio:9/16;max-height:70vh;overflow:hidden}.m video,.m img{width:100%;height:100%;object-fit:cover}.create{padding:14px;background:#0a0a0a}.create input,.create textarea{width:100%;background:#000;border:1px solid #333;color:#fff;padding:10px;border-radius:8px;margin:6px 0}.btn{width:100%;padding:11px;border:none;border-radius:8px;font-weight:800;background:#0095f6;color:#fff}.nav{position:fixed;bottom:0;left:0;right:0;height:50px;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;align-items:center}</style></head><body><div id="login" style="position:fixed;inset:0;background:#000;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px"><div style="width:100%;max-width:360px;text-align:center"><div class="logo" style="font-size:40px">Snoopgram</div><div style="background:#ff0;color:#000;padding:5px 10px;border-radius:20px;font-size:11px;font-weight:800;display:inline-block;margin:10px 0">V3.7 CLEAN!</div><input id="user" placeholder="Username e.g JoshuaBaraka" style="width:100%;padding:12px;margin:14px 0 10px;border-radius:8px;border:1px solid #333;background:#111;color:#fff"><button onclick="login()" style="width:100%;padding:12px;background:#0095f6;color:#fff;border:none;border-radius:8px;font-weight:800">Enter 🚀</button></div></div><div class="h"><div class="logo">Snoopgram</div></div><div class="banner">🔥 V3.7 CLEAN VIDEO!</div><div id="feed"></div><div class="create"><b>Post Your Video</b><input type="file" id="mf" accept="image/*,video/*"><textarea id="cap" placeholder="Caption #Uganda"></textarea><button class="btn" onclick="createPost()">Share 🚀</button><button onclick="localStorage.removeItem('p');location.reload()" style="margin-top:8px;width:100%;padding:8px;background:#222;color:#888;border:1px solid #333;border-radius:8px;font-size:11px">🗑 Clear (Keep Demo)</button></div><div class="nav"><div>⌂</div><div>🇺🇬</div><div>⊕</div><div>▶</div><div>💰</div></div><script>function cName(s){if(!s)return'';try{if(s.includes('{"n"')){let o=JSON.parse(s);return o.n}}catch(e){}return String(s).replace(/[{}":]/g,'').replace(/n:/,'').trim()}let uR=localStorage.getItem('u')||'';let user=cName(uR);if(uR!==user)localStorage.setItem('u',user);let posts=[];try{posts=JSON.parse(localStorage.getItem('p')||'[]')}catch(e){}posts=posts.filter(p=>p.media&&p.media.length>50);if(user)document.getElementById('login').style.display='none';function login(){let v=document.getElementById('user').value.trim();if(!v)return alert('Enter name');user=cName(v);localStorage.setItem('u',user);document.getElementById('login').style.display='none';render()}function toData(f){return new Promise(r=>{let rd=new FileReader();rd.onload=e=>r(e.target.result);rd.readAsDataURL(f);});}async function createPost(){let f=document.getElementById('mf').files[0];if(!f)return alert('Pick video/photo');let cap=document.getElementById('cap').value;let d=await toData(f);let t=f.type.startsWith('video')?'video':'image';posts.unshift({user:user||'You',cap:cap,media:d,mediaType:t,likes:99});localStorage.setItem('p',JSON.stringify(posts));render()}function render(){let fd=document.getElementById('feed');let demos=[{user:'JoshuaBaraka',cap:'Nana OUT NOW! TAP TO PLAY! Tip 0776045094 #Uganda',media:'https://www.w3schools.com/html/mov_bbb.mp4',mediaType:'video',likes:1243},{user:'azawi',cap:'Quinamino VIDEO!',media:'https://www.w3schools.com/html/movie.mp4',mediaType:'video',likes:2891}];let list=[...posts,...demos];let h='';list.forEach(p=>{let m=p.mediaType==='video'?`<div class=m><video src="${p.media}" controls playsinline preload="metadata"></video></div>`:`<div class=m><img src="${p.media}"></div>`;h+=`<div class=post><div class=ph><div class=pr>${p.user[0].toUpperCase()}</div><b>${p.user} ✓</b></div>${m}<div style="padding:8px 12px;font-weight:700">${p.likes} likes</div><div style="padding:0 12px 12px"><b>${p.user}</b> ${p.cap}</div></div>`});fd.innerHTML=h}render();</script></body></html>
